name: Update Naver market data

on:
  schedule:
    - cron: "*/15 0-7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Naver market data
        run: node scripts/update-market-data.mjs

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet && echo "No market data changes" && exit 0
          git commit -m "Update Naver market data"
          git push
          git push origin HEAD:gh-pages --force
