<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Monitor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <button class="refresh-button" id="refreshButton" type="button" aria-label="시세 갱신">
          <span aria-hidden="true">↻</span>
        </button>
      </header>

      <section class="market-strip" aria-label="시장 요약">
        <article>
          <span>환율</span>
          <strong id="exchangeRate">-</strong>
          <small>USD/KRW</small>
        </article>
        <article>
          <span>기준일</span>
          <strong id="baseDate">-</strong>
          <small id="baseTime">-</small>
        </article>
        <article>
          <span>시장분위기</span>
          <strong id="marketMood">-</strong>
          <small id="marketMoodDetail">데이터 수집 중</small>
        </article>
        <article>
          <span>CNN Fear & Greed</span>
          <strong id="fearGreedScore">-</strong>
          <small id="fearGreedDetail">-</small>
        </article>
      </section>

      <section class="watchlist-section" aria-label="관심 종목">
        <div class="section-heading">
          <h2>관심 종목</h2>
          <p id="statusText">시세를 불러오는 중입니다.</p>
        </div>
        <div class="watchlist" id="watchlist"></div>
      </section>

      <section class="chart-section" aria-label="30일 가격 차트">
        <div class="section-heading">
          <h2 id="chartTitle">삼성전자 30일 가격</h2>
          <p id="chartSubtitle">종목 카드를 누르면 차트가 바뀝니다.</p>
        </div>
        <div class="chart-wrap">
          <canvas id="priceChart" height="320"></canvas>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
